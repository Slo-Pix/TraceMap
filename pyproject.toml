[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracemap"
version = "0.1.0"
description = "Crash to green: a failing traceback becomes a verified fix plus a regression test"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "codemap-explorer",
    "rich>=13.9",
    "textual>=0.89",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
tracemap = "tracemap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tracemap"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py311"
